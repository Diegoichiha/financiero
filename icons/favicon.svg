<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Hogy Financiero">
  <defs>
    <linearGradient id="fondo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#171c20"/>
      <stop offset="1" stop-color="#0b0b0c"/>
    </linearGradient>
    <linearGradient id="menta" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#00c896"/>
      <stop offset="1" stop-color="#7bffe0"/>
    </linearGradient>
    <radialGradient id="brillo" cx="0.85" cy="0.08" r="0.85">
      <stop offset="0" stop-color="#1fffc2" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#1fffc2" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- fondo oscuro de la marca con un brillo menta -->
  <rect width="64" height="64" rx="15" fill="url(#fondo)"/>
  <rect width="64" height="64" rx="15" fill="url(#brillo)"/>
  <rect x="1" y="1" width="62" height="62" rx="14" fill="none" stroke="#1fffc2" stroke-opacity="0.3" stroke-width="2"/>
  <!-- barras que suben: el dinero que crece -->
  <rect x="11" y="39" width="11" height="14" rx="3" fill="url(#menta)"/>
  <rect x="26.5" y="30" width="11" height="23" rx="3" fill="url(#menta)"/>
  <rect x="42" y="18" width="11" height="35" rx="3" fill="url(#menta)"/>
  <!-- moneda sobre la barra más alta -->
  <circle cx="47.5" cy="11.5" r="6" fill="#ff8a3d"/>
  <circle cx="47.5" cy="11.5" r="6" fill="none" stroke="#ffd2b0" stroke-opacity="0.55" stroke-width="1"/>
</svg>
